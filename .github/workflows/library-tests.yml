name: Library tests
on:
  push:
    branches: [feature/emudeck-retrodeck-integration, feature/m2-steamdeck-hardware-validation]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B -m unittest discover -s tests -v
      - run: python3 -B tests/benchmark_m2.py
      - run: bash -n rom-cli && bash -n PKGBUILD
      - run: bash rom-cli --version && bash rom-cli --library platforms
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix decky --ignore-scripts
      - run: npm --prefix decky run check && npm --prefix decky test && npm --prefix decky run build
      - run: python3 decky/package_plugin.py decky/rom-library-m2.zip --source-output decky/rom-library-m2-source.zip
      - name: Verify deployment ZIP
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          from tempfile import TemporaryDirectory
          from pathlib import Path
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          with ZipFile("decky/rom-library-m2.zip") as bundle:
              assert bundle.testzip() is None
              names = bundle.namelist()
              assert len(names) == len(set(names))
              assert {"ROM Library/main.py", "ROM Library/dist/index.js", "ROM Library/plugin.json"} <= set(names)
              manifest = json.loads(bundle.read("ROM Library/plugin.json"))
              assert manifest["flags"] == []
              for name in names:
                  path = PurePosixPath(name)
                  assert path.parts[0] == "ROM Library" and ".." not in path.parts
                  assert path.suffix in {".py", ".ts", ".tsx", ".js", ".json", ".md", ""}, name
                  assert path.suffix or path.name == "LICENSE", name
                  assert not {"experiments", "tests", "models", "recordings", "node_modules", "__pycache__", "src"}.intersection(path.parts), name
                  assert path.name not in {"package-lock.json", "tsconfig.json", "rollup.config.js"}, name
              print(f"{len(names)} unique members, valid CRCs, unprivileged manifest")
              with TemporaryDirectory() as tmp:
                  bundle.extractall(tmp)
                  subprocess.run([sys.executable, "-I", "-B", str(Path("tests/check_decky_runtime.py").resolve()),
                                  str(Path(tmp) / "ROM Library")], cwd=tmp, check=True)
          PY
          sha256sum decky/rom-library-m2.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rom-library-m2
          path: decky/rom-library-m2.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rom-library-m2-source
          path: decky/rom-library-m2-source.zip

